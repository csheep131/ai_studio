<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Studio Film{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#0f1117',
            panel:   '#1a1d27',
            border:  '#2a2d3a',
            accent:  '#3b82f6',      // Blue primary
            accent2: '#06b6d4',      // Cyan secondary
            warn:    '#f59e0b',
            ok:      '#22c55e',
            err:     '#ef4444',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <style>
    body { background: #0f1117; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1d27; }
    ::-webkit-scrollbar-thumb { background: #3a3d4a; border-radius: 3px; }
    .log-line { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.4; }
    video { max-width: 100%; border-radius: 6px; }
    .pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
  {% block content %}{% endblock %}
</body>
</html>
